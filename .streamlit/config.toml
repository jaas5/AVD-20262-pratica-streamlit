# Configuração do Streamlit - Tema Dark Mode Premium com Gradientes
[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#131A2A"
textColor = "#E2E8F0"
borderColor = "#1E293B"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
paddingTop = "0.75rem"
baseRadius = "0.75rem"
showWidgetBorder = true
chartCategoricalColors = ["#6366F1", "#38BDF8", "#EC4899", "#10B981", "#F59E0B", "#A855F7"]

[theme.sidebar]
backgroundColor = "#0F1524"
textColor = "#E2E8F0"
borderColor = "#1E293B"
