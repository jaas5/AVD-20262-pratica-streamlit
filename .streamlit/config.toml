# Configuração do Streamlit. Descomente e ajuste conforme o projeto avançar.
# O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
base = "light"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
paddingTop = "0.5rem"
baseRadius = "0.5rem"
showWidgetBorder = true
chartCategoricalColors = ["#638CA0", "#C98279", "#8DAA91", "#C4A56E", "#8D8BA8"]
primaryColor = "#638CA0"
backgroundColor = "#F7F9F9"
secondaryBackgroundColor = "#EEF2F3"
textColor = "#27343A"
borderColor = "#DCE4E6"

[theme.sidebar]
backgroundColor = "#EEF2F3"
textColor = "#34434B"
borderColor = "#DCE4E6"
